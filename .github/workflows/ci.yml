name: CI

# Builds every target and runs the full test suite on every push and PR.
#
# OpenCV is installed on purpose, even though no test needs it. Without it CMake
# skips the GUI targets, and the two files that exist only for non-Windows
# platforms -- the OpenCV room dialog and the miniaudio sound player -- would
# never be compiled anywhere at all. Code that is never built on a platform is
# code that is broken on it without anyone knowing, so this job builds it.

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install a C++20 toolchain, CMake and OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libopencv-dev

      - name: Configure (Debug)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      # Everything, not just kfc_tests: this is what actually compiles the
      # Linux GUI client and its audio backend.
      - name: Build every target
        run: cmake --build build

      - name: Run the full suite (unit + integration)
        run: ctest --test-dir build --output-on-failure
